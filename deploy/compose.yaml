services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_local
      POSTGRES_DB: agentic
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.2.10-alpine
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  postgres-data:
