        type: string
      requestKey:
        type: string
      revision:
        type: integer
      ttlSeconds:
        type: integer
    type: object
  sandboxcenter.sandboxView:
    properties:
      lease:
        $ref: '#/definitions/sandboxcenter.Lease'
      sandbox:
        $ref: '#/definitions/sandboxcenter.Sandbox'
