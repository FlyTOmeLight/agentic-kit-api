  sandboxcenter.Operation:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      dispatchedAt:
        type: string
      error:
        type: string
      executionId:
        type: string
      exitCode:
        type: integer
      id:
        type: string
      kind:
        type: string
      leaseId:
        type: string
      output:
        type: string
      receiptStoredAt:
        type: string
      requestKey:
        type: string
      sandboxId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
      version:
        type: integer
    type: object
  sandboxcenter.Sandbox:
    properties:
      createdAt:
        type: string
      destroyedAt:
        type: string
      generation:
        type: integer
      id:
        type: string
      leaseId:
        type: string
      ownerId:
        type: string
      podUid:
        type: string
      profileId:
        type: string
      profileRevision:
        type: integer
      requestKey:
        type: string
      requiredSave:
        type: boolean
      restoreFromSandboxId:
        type: string
      resumeCheckpoint:
        type: string
      savedCheckpoint:
        type: string
      status:
        type: string
      stoppedAt:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
      version:
        type: integer
      workspaceUid:
        type: string
