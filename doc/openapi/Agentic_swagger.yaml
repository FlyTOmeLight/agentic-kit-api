  sandboxcenter.acquireRequest:
    properties:
      ownerId:
        type: string
      profileId:
        type: string
      requestKey:
        type: string
      requiredSave:
        type: boolean
      restoreFromSandboxId:
        type: string
      runEpoch:
        type: integer
      runId:
        type: string
      tenantId:
        type: string
      ttlSeconds:
        type: integer
      workerId:
        type: string
