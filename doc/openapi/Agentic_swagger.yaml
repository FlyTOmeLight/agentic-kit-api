basePath: /
definitions:
  agenticv1.Agent:
    properties:
      createdAt:
        type: string
      draft:
        $ref: '#/definitions/agenticv1.AgentConfig'
      id:
        type: string
      name:
        type: string
      publishedVersion:
        type: integer
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  agenticv1.AgentConfig:
    properties:
      maxTurns:
        type: integer
      model:
        $ref: '#/definitions/agenticv1.ModelSpec'
      systemPrompt:
        type: string
      tools:
        items:
          $ref: '#/definitions/agenticv1.ToolSpec'
        type: array
      toolsets:
        items:
          type: string
        type: array
    type: object
  agenticv1.AgentVersion:
    properties:
      agentID:
        type: string
      config:
        $ref: '#/definitions/agenticv1.AgentConfig'
      createdAt:
        type: string
      number:
        type: integer
    type: object
  agenticv1.CreateAgentRequest:
    properties:
      config:
        $ref: '#/definitions/agenticv1.AgentConfig'
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  agenticv1.CreateSessionRequest:
    properties:
      agentID:
        maxLength: 128
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - agentID
    type: object
  agenticv1.Event:
    properties:
      createdAt:
        type: string
      kind:
        type: string
      payload:
        type: object
      runID:
        type: string
      seq:
        type: integer
    type: object
  agenticv1.ExecutionSpec:
    properties:
      agentID:
        type: string
      agentVersion:
        type: integer
      filesystem:
        $ref: '#/definitions/agenticv1.FilesystemBinding'
      query:
        type: string
      scope:
        $ref: '#/definitions/agenticv1.Scope'
    type: object
  agenticv1.FilesystemBinding:
    properties:
      provider:
        type: string
      tokenEnv:
        type: string
      url:
        type: string
      workspace:
        type: string
    type: object
  agenticv1.LeaseCheck:
    properties:
      allowed:
        type: boolean
    type: object
  agenticv1.ModelSpec:
    properties:
      apiKeyEnv:
        type: string
      baseURL:
        type: string
      maxTokens:
        type: integer
      name:
        type: string
      temperature:
        type: number
      topP:
        type: number
    type: object
  agenticv1.Page-agenticv1_Agent:
    properties:
      items:
        items:
          properties:
            createdAt:
              type: string
            draft:
              $ref: '#/definitions/agenticv1.AgentConfig'
            id:
              type: string
            name:
              type: string
            publishedVersion:
              type: integer
            revision:
              type: integer
            updatedAt:
              type: string
          type: object
        type: array
    type: object
  agenticv1.Page-agenticv1_Run:
    properties:
      items:
        items:
          properties:
            agentID:
              type: string
            attempt:
              type: integer
            configVersion:
              type: string
            deadline:
              type: string
            epoch:
              type: integer
            error:
              type: string
            eventSeq:
              type: integer
            id:
              type: string
            output:
              type: string
            ownerID:
              type: string
            scope:
              $ref: '#/definitions/agenticv1.Scope'
            sessionID:
              type: string
            status:
              type: string
            waitingStep:
              type: string
          type: object
        type: array
    type: object
  agenticv1.Page-agenticv1_Session:
    properties:
      items:
        items:
          properties:
            agentID:
              type: string
            createdAt:
              type: string
            id:
              type: string
            messageSeq:
              type: integer
            title:
              type: string
            updatedAt:
              type: string
          type: object
        type: array
    type: object
  agenticv1.Page-agenticv1_SessionMessage:
    properties:
      items:
        items:
          properties:
            content:
              type: string
            createdAt:
              type: string
            kind:
              type: string
            role:
              type: string
            runID:
              type: string
            seq:
              type: integer
            sessionID:
              type: string
            toolCallID:
              type: string
            toolCalls:
              items:
                $ref: '#/definitions/agenticv1.ToolCall'
              type: array
          type: object
        type: array
    type: object
  agenticv1.PublishAgentRequest:
    properties:
      revision:
        minimum: 1
        type: integer
    type: object
  agenticv1.Run:
    properties:
      agentID:
        type: string
      attempt:
        type: integer
      configVersion:
        type: string
      deadline:
        type: string
      epoch:
        type: integer
      error:
        type: string
      eventSeq:
        type: integer
      id:
        type: string
      output:
        type: string
      ownerID:
        type: string
      scope:
        $ref: '#/definitions/agenticv1.Scope'
      sessionID:
        type: string
      status:
        type: string
      waitingStep:
        type: string
    type: object
  agenticv1.RunTrace:
    properties:
      events:
        items:
          $ref: '#/definitions/agenticv1.Event'
        type: array
      hasMore:
        type: boolean
      latestEvent:
        $ref: '#/definitions/agenticv1.Event'
      nextSeq:
        type: integer
      run:
        $ref: '#/definitions/agenticv1.Run'
    type: object
  agenticv1.Scope:
    properties:
      actorID:
        type: string
      projectID:
        type: string
      roundID:
        type: string
      taskID:
        type: string
      tenantID:
        type: string
    type: object
  agenticv1.SendMessageRequest:
    properties:
      query:
        type: string
    required:
    - query
    type: object
  agenticv1.Session:
    properties:
      agentID:
        type: string
      createdAt:
        type: string
      id:
        type: string
      messageSeq:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  agenticv1.SubmitExecutionRequest:
    properties:
      spec:
        $ref: '#/definitions/agenticv1.ExecutionSpec'
      timeoutSeconds:
        maximum: 86400
        minimum: 1
        type: integer
    type: object
  agenticv1.SupplyResultRequest:
    properties:
      result:
        type: string
      stepID:
        maxLength: 128
        type: string
    required:
    - result
    - stepID
    type: object
  agenticv1.ToolCall:
    properties:
      arguments:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  agenticv1.ToolSpec:
    properties:
      description:
        type: string
      endRun:
        type: boolean
      kind:
        type: string
      name:
        type: string
      parameters:
        type: object
      policy:
        type: string
      resourceID:
        type: string
      returnDirectly:
        type: boolean
      tokenEnv:
        type: string
      toolID:
        type: string
      url:
        type: string
    type: object
  agenticv1.UpdateAgentRequest:
    properties:
      config:
        $ref: '#/definitions/agenticv1.AgentConfig'
      name:
        maxLength: 200
        type: string
      revision:
        minimum: 1
        type: integer
    required:
    - name
    type: object
  errors.Error:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
info:
  contact: {}
  description: Generic Agent, Session, Run and Execution interfaces.
  title: Agentic Kit API
  version: "1.0"
paths:
  /internal/v1/executions:
    post:
      consumes:
      - application/json
      parameters:
      - description: 幂等标识；相同请求重放返回已有任务
        in: header
        maxLength: 128
        name: Idempotency-Key
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.SubmitExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 幂等重放
          schema:
            $ref: '#/definitions/agenticv1.Run'
        "202":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Run'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 提交执行任务
      tags:
      - Run
  /internal/v1/executions/{id}/lease:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: 执行 epoch
        in: query
        minimum: 1
        name: epoch
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.LeaseCheck'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 校验任务执行权
      tags:
      - Run
  /internal/v1/healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 查询内部执行入口健康状态
      tags:
      - Run
  /v1/agents:
    get:
      parameters:
      - default: 50
        description: 每页数量
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 上一页末项游标
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Page-agenticv1_Agent'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 列出 Agent
      tags:
      - Agent
    post:
      consumes:
      - application/json
      parameters:
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Agent'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 创建 Agent
      tags:
      - Agent
  /v1/agents/{id}:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Agent'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 查询 Agent
      tags:
      - Agent
    put:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Agent'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态、评测条件或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 更新 Agent 草稿
      tags:
      - Agent
  /v1/agents/{id}/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.PublishAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.AgentVersion'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态、评测条件或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 发布不可变 Agent 版本
      tags:
      - Agent
  /v1/agents/{id}/versions/{number}:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: number
        in: path
        minimum: 1
        name: number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.AgentVersion'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 查询 Agent 版本
      tags:
      - Agent
  /v1/runs/{id}:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Run'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 查询任务
      tags:
      - Run
  /v1/runs/{id}/answer:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.SupplyResultRequest'
      produces:
      - application/json
      responses:
        "204":
          description: 成功，无响应体
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态、评测条件或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 提交澄清答案
      tags:
      - Run
  /v1/runs/{id}/cancel:
    post:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 成功，无响应体
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态、评测条件或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 取消任务
      tags:
      - Run
  /v1/runs/{id}/events:
    get:
      description: SSE id 为 runID:seq，event 为事件 kind，data 为 JSON Event；空闲时发送心跳。输出开始后的读取或写入错误关闭连接，客户端使用最后收到的
        id 重连；终态事件回放完成后关闭连接。
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: 断点游标 runID:seq，优先于 after
        in: header
        name: Last-Event-ID
        type: string
      - description: 断点游标 runID:seq
        in: query
        name: after
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 订阅任务事件
      tags:
      - Run
  /v1/runs/{id}/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.SupplyResultRequest'
      produces:
      - application/json
      responses:
