info:
  contact: {}
  description: Generic Agent, Session, Run and Execution interfaces.
  title: Agentic Kit API
  version: "1.0"
paths:
  /internal/v1/executions:
    post:
      consumes:
      - application/json
      parameters:
      - description: 幂等标识；相同请求重放返回已有任务
        in: header
        maxLength: 128
        name: Idempotency-Key
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agenticv1.SubmitExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 幂等重放
          schema:
            $ref: '#/definitions/agenticv1.Run'
        "202":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.Run'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 版本、任务状态或幂等标识冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 提交执行任务
      tags:
      - Run
  /internal/v1/executions/{id}/callback:
    post:
      consumes:
      - application/json
      parameters:
      - description: run id
        in: path
        name: id
        required: true
        type: string
      - description: JSON 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/run.executionCallbackRequest'
      produces:
      - application/json
      responses:
        "204":
          description: 成功，无响应体
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 来源不允许
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: 状态或幂等冲突
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: 请求体超过限制
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 外部系统回调
      tags:
      - Run
  /internal/v1/executions/{id}/lease:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: 执行 epoch
        in: query
        minimum: 1
        name: epoch
        required: true
        type: integer
      - description: 领取 worker ID
        in: query
        name: workerId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/agenticv1.LeaseCheck'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: 校验任务执行权
      tags:
      - Run
  /internal/v1/goals:
    get:
      parameters:
      - description: 状态过滤
        in: query
        name: status
        type: string
      - description: 上限
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            items:
              $ref: '#/definitions/execution.Goal'
            type: array
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: 身份校验失败
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
