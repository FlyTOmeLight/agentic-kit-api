basePath: /
definitions:
  agent.Agent:
    properties:
      createdAt:
        type: string
      draft:
        $ref: '#/definitions/agent.AgentConfig'
      id:
        type: string
      name:
        type: string
      publishedVersion:
        type: integer
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  agent.AgentConfig:
    properties:
      maxTurns:
        type: integer
      model:
        $ref: '#/definitions/agent.ModelSpec'
      systemPrompt:
        type: string
      tools:
        items:
          $ref: '#/definitions/agent.ToolSpec'
        type: array
      toolsets:
        items:
          type: string
        type: array
    type: object
  agent.ModelSpec:
    properties:
      apiKeyEnv:
        type: string
      baseURL:
        type: string
      contextWindow:
        type: integer
      maxTokens:
        type: integer
      name:
        type: string
      temperature:
        type: number
      topP:
        type: number
    type: object
  agent.ToolSpec:
    properties:
      description:
        type: string
      endRun:
        type: boolean
      kind:
        type: string
      name:
        type: string
      parameters:
        type: object
      policy:
        type: string
      resourceID:
        type: string
      returnDirectly:
        type: boolean
      tokenEnv:
        type: string
      toolID:
        type: string
      url:
        type: string
    type: object
  agenticv1.Agent:
    properties:
      createdAt:
        type: string
      draft:
        $ref: '#/definitions/agent.AgentConfig'
      id:
        type: string
      name:
        type: string
      publishedVersion:
        type: integer
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  agenticv1.AgentConfig:
    properties:
      maxTurns:
        type: integer
      model:
        $ref: '#/definitions/agent.ModelSpec'
      systemPrompt:
        type: string
      tools:
        items:
          $ref: '#/definitions/agent.ToolSpec'
        type: array
      toolsets:
        items:
          type: string
        type: array
    type: object
  agenticv1.AgentVersion:
    properties:
      agentID:
        type: string
      config:
        $ref: '#/definitions/agent.AgentConfig'
      createdAt:
        type: string
      number:
        type: integer
    type: object
  agenticv1.CreateAgentRequest:
    properties:
      config:
        $ref: '#/definitions/agenticv1.AgentConfig'
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  agenticv1.CreateMemoryRequest:
    properties:
      document:
        $ref: '#/definitions/agenticv1.MemoryDocument'
    required:
    - document
    type: object
  agenticv1.CreateSessionRequest:
    properties:
      agentID:
        maxLength: 128
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - agentID
    type: object
  agenticv1.ExecutionSpec:
    properties:
      agentID:
        type: string
      agentVersion:
        type: integer
      filesystem:
        $ref: '#/definitions/execution.FilesystemBinding'
      goalID:
        description: |-
          GoalID optionally binds the run to a durable goal. The goal must exist
          and be Active; the run is bound atomically at accept time.
        type: string
      query:
        type: string
      scope:
        $ref: '#/definitions/workspace.Scope'
    type: object
  agenticv1.LeaseCheck:
    properties:
      allowed:
        type: boolean
      checkedAt:
        type: string
      epoch:
        type: integer
      expiresAt:
        type: string
      runId:
        type: string
      scope:
        $ref: '#/definitions/workspace.Scope'
      workerId:
        type: string
    type: object
  agenticv1.MemoryDocument:
    properties:
      agentID:
        type: string
      body:
        type: object
      conditions:
        $ref: '#/definitions/memory.Conditions'
      entryID:
        type: string
      kind:
        type: string
      outputVisibility:
        type: string
      schemaVersion:
        type: integer
      scope:
        $ref: '#/definitions/memory.Scope'
      source:
        $ref: '#/definitions/memory.Source'
      subjectKey:
        type: string
      summary:
        type: string
      validUntil:
        type: integer
    type: object
  agenticv1.MemoryEntry:
    properties:
      activeVersionRef:
        $ref: '#/definitions/memory.VersionRef'
      agentID:
        type: string
      body:
        type: object
      conditions:
        $ref: '#/definitions/memory.Conditions'
      id:
        type: string
      kind:
        type: string
      outputVisibility:
        type: string
      retiredAt:
        type: integer
      revision:
        type: integer
      scope:
        $ref: '#/definitions/memory.Scope'
      source:
        $ref: '#/definitions/memory.Source'
      subjectKey:
        type: string
      summary:
        type: string
      validUntil:
        type: integer
    type: object
  agenticv1.MemoryRecallFilter:
    properties:
      maxBytes:
        type: integer
      maxEntries:
        type: integer
      tags:
        items:
          type: string
        type: array
      terms:
        items:
          type: string
        type: array
    type: object
  agenticv1.Page-agenticv1_Agent:
    properties:
      items:
        items:
          $ref: '#/definitions/agent.Agent'
        type: array
    type: object
  agenticv1.Page-agenticv1_Run:
    properties:
      items:
        items:
          $ref: '#/definitions/execution.Run'
        type: array
    type: object
  agenticv1.Page-agenticv1_Session:
    properties:
      items:
        items:
          $ref: '#/definitions/execution.Session'
        type: array
    type: object
  agenticv1.Page-agenticv1_SessionMessage:
    properties:
      items:
        items:
          $ref: '#/definitions/execution.SessionMessage'
        type: array
    type: object
  agenticv1.PublishAgentRequest:
    properties:
      revision:
        minimum: 1
        type: integer
    type: object
  agenticv1.RetireMemoryRequest:
    properties:
      expectedRevision:
        minimum: 1
        type: integer
    required:
    - expectedRevision
    type: object
  agenticv1.Run:
    properties:
      agentID:
        type: string
      attempt:
        type: integer
      configVersion:
        type: string
      costUSD:
        type: number
      deadline:
        type: string
      epoch:
        type: integer
      error:
        type: string
      eventSeq:
        type: integer
      goalID:
        type: string
      id:
        type: string
      output:
        type: string
      ownerID:
        type: string
      parentRunID:
        type: string
      parentStepID:
        type: string
      scope:
        $ref: '#/definitions/workspace.Scope'
      sessionID:
        type: string
      status:
        type: string
      tokensUsed:
        type: integer
      waitingExternalRef:
        type: string
      waitingKind:
        type: string
      waitingStep:
        type: string
    type: object
  agenticv1.RunTrace:
    properties:
      events:
        items:
          $ref: '#/definitions/execution.Event'
        type: array
      hasMore:
        type: boolean
      latestEvent:
        $ref: '#/definitions/execution.Event'
      nextSeq:
        type: integer
      run:
        $ref: '#/definitions/execution.Run'
    type: object
  agenticv1.SendMessageRequest:
    properties:
      memory:
        enum:
        - "Off"
        - Recall
        type: string
      memoryFilter:
        $ref: '#/definitions/agenticv1.MemoryRecallFilter'
      query:
        type: string
    required:
    - query
    type: object
  agenticv1.Session:
    properties:
      agentID:
        type: string
      createdAt:
        type: string
      id:
        type: string
      messageSeq:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  agenticv1.SubmitExecutionRequest:
    properties:
      memory:
        enum:
        - "Off"
        - Recall
        type: string
      memoryFilter:
        $ref: '#/definitions/agenticv1.MemoryRecallFilter'
      spec:
        $ref: '#/definitions/agenticv1.ExecutionSpec'
      timeoutSeconds:
        maximum: 86400
        minimum: 1
        type: integer
    type: object
  agenticv1.SupplyResultRequest:
    properties:
      result:
        type: string
      stepID:
        maxLength: 128
        type: string
    required:
    - result
    - stepID
    type: object
  agenticv1.UpdateAgentRequest:
    properties:
      config:
        $ref: '#/definitions/agenticv1.AgentConfig'
      name:
        maxLength: 200
        type: string
      revision:
        minimum: 1
        type: integer
    required:
    - name
    type: object
  agenticv1.UpdateMemoryRequest:
    properties:
      document:
        $ref: '#/definitions/agenticv1.MemoryDocument'
      expectedRevision:
        minimum: 1
        type: integer
    required:
    - document
    - expectedRevision
    type: object
  errors.Error:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
  execution.BudgetSpec:
    properties:
      maxCostUSD:
        type: number
      maxTokens:
        type: integer
      maxWallClockSeconds:
        type: integer
    type: object
  execution.Evaluation:
    properties:
      createdAt:
        type: string
      goalID:
        type: string
      id:
        type: string
      output:
        type: string
      ownerID:
        type: string
      runID:
        type: string
      status:
        type: string
    type: object
  execution.EvaluatorSpec:
    properties:
      config:
        type: string
      kind:
        type: string
    type: object
  execution.Event:
    properties:
      createdAt:
        type: string
      kind:
        type: string
      payload:
        type: object
      runID:
        type: string
      seq:
        type: integer
    type: object
  execution.FilesystemBinding:
    properties:
      profileId:
        description: |-
          ProfileID selects the sandbox-center isolation profile when Provider is
          "Sandbox". Empty means the default coding profile.
        type: string
      provider:
        description: |-
          Provider selects the execution backend: "AIO" for the legacy direct
          adapter, "Sandbox" for the sandbox-center control plane.
        type: string
      restoreFromSandboxId:
        type: string
      tokenEnv:
        type: string
      url:
        type: string
      workspace:
        type: string
    type: object
  execution.Goal:
    properties:
      activeRunID:
        type: string
      budget:
        $ref: '#/definitions/execution.BudgetSpec'
      costUSD:
        type: number
      createdAt:
        type: string
      evaluator:
        $ref: '#/definitions/execution.EvaluatorSpec'
      id:
        type: string
      lastStallMark:
        type: string
      objective:
        type: string
      ownerID:
        type: string
      sessionID:
        type: string
      stallCount:
        type: integer
      status:
        type: string
      tokensUsed:
        type: integer
      updatedAt:
        type: string
    type: object
  execution.Run:
    properties:
      agentID:
        type: string
      attempt:
        type: integer
      configVersion:
        type: string
      costUSD:
        type: number
      deadline:
        type: string
      epoch:
        type: integer
      error:
        type: string
      eventSeq:
        type: integer
      goalID:
        type: string
      id:
        type: string
      output:
        type: string
      ownerID:
        type: string
      parentRunID:
        type: string
      parentStepID:
        type: string
      scope:
        $ref: '#/definitions/workspace.Scope'
      sessionID:
        type: string
      status:
        type: string
      tokensUsed:
        type: integer
      waitingExternalRef:
        type: string
      waitingKind:
        type: string
      waitingStep:
        type: string
    type: object
  execution.Session:
    properties:
      agentID:
        type: string
      createdAt:
        type: string
      id:
        type: string
      messageSeq:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  execution.SessionMessage:
    properties:
      content:
        type: string
      createdAt:
        type: string
      kind:
        type: string
      role:
        type: string
      runID:
        type: string
      seq:
        type: integer
      sessionID:
        type: string
      toolCallID:
        type: string
      toolCalls:
        items:
          $ref: '#/definitions/execution.ToolCall'
        type: array
    type: object
  execution.ToolCall:
    properties:
      arguments:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  memory.Conditions:
    properties:
      taskTags:
        items:
          type: string
        type: array
      toolNames:
        items:
          type: string
        type: array
    type: object
  memory.Scope:
    properties:
      actor:
        type: string
      kind:
        type: string
      owner:
        type: string
      project:
        type: string
      tenant:
        type: string
    type: object
  memory.Source:
    properties:
      actor:
        type: string
      class:
        type: string
      evidence:
        items:
          $ref: '#/definitions/memory.SourceEvidence'
        type: array
    type: object
  memory.SourceEvidence:
    properties:
      eventID:
        type: string
      messageID:
        type: string
      runID:
        type: string
      stepID:
        type: string
      summary:
        type: string
    type: object
  memory.VersionRef:
    properties:
      artifactID:
        type: string
      projectID:
        type: string
      sequence:
        type: integer
      storeID:
        type: string
      tenantID:
        type: string
      userID:
        type: string
      versionID:
        type: string
      versionURI:
        type: string
    type: object
  run.createGoalRequest:
    properties:
      budget:
        $ref: '#/definitions/execution.BudgetSpec'
      evaluator:
        $ref: '#/definitions/execution.EvaluatorSpec'
      objective:
        type: string
      requestHash:
        maxLength: 128
        type: string
      requestKey:
        maxLength: 128
        type: string
      sessionID:
        maxLength: 128
        type: string
    required:
    - objective
    - requestHash
    - requestKey
    - sessionID
    type: object
  run.executionCallbackRequest:
    properties:
      externalRef:
        maxLength: 128
        type: string
      result:
        type: string
      stepID:
        maxLength: 128
        type: string
    required:
    - externalRef
    - result
    - stepID
    type: object
  run.recordEvaluationRequest:
    properties:
      output:
        maxLength: 65536
        type: string
      runID:
        maxLength: 128
        type: string
      status:
        enum:
        - Passed
        - Failed
        - Error
        type: string
    required:
    - runID
    - status
    type: object
  run.steerGoalRequest:
    properties:
      content:
        maxLength: 4096
        type: string
    required:
    - content
    type: object
  sandboxcenter.Lease:
