AppName = "agentic-kit-api"
AppCode = 100
RunMode = "${env:GIN_MODE:release}"

[HTTPServer]
Listen = "${env:LISTEN_ADDR:127.0.0.1:8080}"
ReadTimeout = 10000
# SSE has no total response deadline. Request cancellation ends the stream.
WriteTimeout = -1
IdleTimeout = 60000

[DB]
Driver = "PostgreSQL"
AutoMigrate = false
MaxOpenConns = 20
MaxIdleConns = 5
ConnMaxIdleTime = 300
DSN = "${env:DATABASE_URL:postgres://agentic:agentic_local@127.0.0.1:55432/agentic?sslmode=disable}"

[Redis]
Addrs = ["${env:REDIS_ADDR:127.0.0.1:56379}"]
DB = 0

# Optional outbound service clients. Timeout is in seconds.
[Tenant]
Endpoint = "${env:TENANT_ENDPOINT:}"
ProxyURL = "${env:TENANT_PROXY_URL:}"
Retry = 0
Timeout = 10
[Tenant.Credentials]
AuthType = "api_key"
APIKey = "${env:TENANT_API_KEY:}"

[Coding]
Endpoint = "${env:CODING_ENDPOINT:}"
ProxyURL = "${env:CODING_PROXY_URL:}"
Retry = 0
Timeout = 20
[Coding.Credentials]
AuthType = "api_key"
APIKey = "${env:CODING_API_KEY:}"
