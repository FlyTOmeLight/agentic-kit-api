AppName = "agentic-kit-api"
AppCode = 100
RunMode = "${env:GIN_MODE:release}"

[HTTPServer]
Listen = "${env:LISTEN_ADDR:127.0.0.1:8080}"
ReadTimeout = 10000
# Non-SSE requests use WriteTimeout; SSE clears the server write deadline via stream.NewSSE.
WriteTimeout = 60000
IdleTimeout = 60000

[DB]
Driver = "PostgreSQL"
AutoMigrate = false
MaxOpenConns = 20
MaxIdleConns = 5
ConnMaxIdleTime = 300
DSN = "${env:DATABASE_URL:postgres://agentic:agentic_local@127.0.0.1:55432/agentic?sslmode=disable}"

[Redis]
Addrs = ["${env:REDIS_ADDR:127.0.0.1:56379}"]
DB = 0

[Artifact]
Endpoint = "${env:ARTIFACT_ENDPOINT:}"
StoreID = "${env:ARTIFACT_STORE_ID:artifact}"
TenantID = "${env:ARTIFACT_TENANT_ID:}"
BearerToken = "${env:ARTIFACT_BEARER_TOKEN:}"
TimeoutSeconds = "${env:ARTIFACT_TIMEOUT_SECONDS:30}"
MaxPayloadBytes = "${env:ARTIFACT_MAX_PAYLOAD_BYTES:262144}"

[Pricing]
Version = "${env:PRICING_VERSION:}"
Models = []

# To enable cost accounting, replace Models = [] with model entries:
# [[Pricing.Models]]
# Name = "your-model"
# InputPerMillion = 1.0
# CachedInputPerMillion = 0.0
# OutputPerMillion = 2.0
# Prices are USD per million tokens. Omit cached price to use input price.
# Empty Version derives a stable catalog digest; each Run freezes its price.

# Sandbox routes require an allowed Forge service. With an allowlist,
# empty K8sContext serves metadata routes without provisioning pods.
[Sandbox]
# Empty disables sandbox HTTP routes.
AllowedServices = []
K8sContext = "${env:SANDBOX_K8S_CONTEXT:}"
K8sNamespace = "${env:SANDBOX_K8S_NAMESPACE:sandbox-center}"
GuardImage = "${env:SANDBOX_GUARD_IMAGE:}"
# RuntimeClassName stays empty locally and in CI until the gVisor node pool
# is configured at stage 4.
RuntimeClassName = "${env:SANDBOX_RUNTIME_CLASS:}"
CheckpointImage = "${env:SANDBOX_CHECKPOINT_IMAGE:}"
CheckpointStoreHostPath = "${env:SANDBOX_CHECKPOINT_STORE_HOST_PATH:}"
CheckpointStorePVC = "${env:SANDBOX_CHECKPOINT_STORE_PVC:}"
WorkspaceStorageClass = "${env:SANDBOX_WORKSPACE_STORAGE_CLASS:}"
WorkspaceAccessMode = "${env:SANDBOX_WORKSPACE_ACCESS_MODE:ReadWriteOnce}"

[Callback]
# Enabling requires SigningSecret and both nonempty allowlists.
Enabled = false
SigningSecret = "${env:CALLBACK_SIGNING_SECRET:}"
AllowedSources = []
AllowedServices = []

[Tenant]
# Required at startup. HTTPS only, except HTTP on loopback.
Endpoint = "${env:TENANT_ENDPOINT:}"
# This API's Forge service credential, not the caller's user credential.
ServiceAPIKey = "${env:TENANT_SERVICE_API_KEY:}"
# Milliseconds; zero uses the SDK default.
Timeout = 5000
# Empty disables internal execution, goal and lease HTTP routes.
AllowedPropagationServices = []

# Published Agent configuration, submitted Artifact attachment resolution, and
# mounted skill package resolution/download grants use artifact-go. Timeout is
# in milliseconds; zero keeps the SDK default.
[AgentArtifact]
Endpoint = "${env:AGENT_ARTIFACT_ENDPOINT:http://127.0.0.1:18080}"
Timeout = 5000

# Optional service allowlist for trusted worker control-plane callbacks
# (e.g. on-demand read of frozen skill files). Empty disables those routes.
[Worker]
AllowedServices = []
