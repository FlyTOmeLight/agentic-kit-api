image:
  repository: agentic-kit-api
  tag: dev
  pullPolicy: IfNotPresent
existingSecret: ""
replicas: 1
database:
  image: postgres:17.6-alpine
  existingSecret: ""
  storage: 2Gi
redis:
  image: redis:7.2-alpine
artifact:
  endpoint: ""
  storeID: artifact
  tenantID: ""
  # Supply ARTIFACT_BEARER_TOKEN in existingSecret; do not put it in values.
  timeoutSeconds: 30
  maxPayloadBytes: 262144
