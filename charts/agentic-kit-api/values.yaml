image:
  repository: agentic-kit-api
  tag: dev
  pullPolicy: IfNotPresent
existingSecret: ""
replicas: 1
database:
  image: postgres:17.6-alpine
  existingSecret: ""
  storage: 2Gi
redis:
  image: redis:7.2-alpine
artifact:
  endpoint: ""
  storeID: artifact
  tenantID: ""
  # Supply ARTIFACT_BEARER_TOKEN in existingSecret; do not put it in values.
  timeoutSeconds: 30
  maxPayloadBytes: 262144
sandbox:
  enabled: false
  apiImage: ""
  kubeconfigSecret: ""
  # Existing Secret with key "config.toml"; the file must keep the
  # ${env:VAR:default} bindings used by conf/server/config.toml.
  existingConfigSecret: ""
  context: ""
  namespace: sandbox-center
  guardImage: ""
  runtimeClass: ""
  checkpointImage: ""
  checkpointPVC: ""
  workspaceStorageClass: ""
  workspaceAccessMode: ""
